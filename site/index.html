<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RONANLAB 포트폴리오</title>
  <meta name="description" content="영화관 로비를 걸어 다니며 둘러보는 RONANLAB 포트폴리오">
  <meta name="theme-color" content="#0b0708">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body class="mode-boot">

  <!-- 늘 보이는 메뉴 줄 -->
  <header class="topbar">
    <a class="brand" href="./" aria-label="RONANLAB"><span id="brand">RONANLAB</span></a>
    <nav class="menu" aria-label="메뉴">
      <button type="button" data-open="about" data-section="projects">프로젝트 소개</button>
      <button type="button" data-open="about" data-section="self">자기소개</button>
      <button type="button" data-open="contact">연락처</button>
    </nav>
  </header>

  <!-- 3D 로비 -->
  <canvas id="scene" aria-label="영화관 로비. 벽에 프로젝트 포스터 네 장이 걸려 있습니다."></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hint" id="hint" hidden></div>
    <button type="button" class="openbtn" id="openbtn" hidden>열기</button>
    <div class="stick stick-left" id="stick-move" aria-hidden="true"><div class="stick-knob"></div><span>걷기</span></div>
    <div class="stick stick-right" id="stick-look" aria-hidden="true"><div class="stick-knob"></div><span>둘러보기</span></div>
    <p class="keys" id="keys">WASD 또는 방향키로 걷기, 마우스를 누른 채 끌어 둘러보기, Shift 로 달리기</p>
  </div>

  <!-- 들어가기 전 안내 -->
  <section class="intro" id="intro">
    <div class="intro-card">
      <p class="intro-kicker">RONANLAB CINEMA</p>
      <h1 id="intro-title">NOW SHOWING</h1>
      <p class="intro-lead" id="intro-lead"></p>
      <ul class="intro-how">
        <li class="only-desktop"><b>걷기</b> WASD 또는 방향키</li>
        <li class="only-desktop"><b>둘러보기</b> 마우스를 누른 채 끌기</li>
        <li class="only-touch"><b>걷기</b> 왼쪽 조이스틱</li>
        <li class="only-touch"><b>둘러보기</b> 오른쪽 조이스틱</li>
        <li><b>프로젝트 열기</b> 포스터에 가까이 가서 누르기</li>
      </ul>
      <div class="intro-actions">
        <button type="button" class="btn btn-primary" id="enter" disabled>로비 불러오는 중</button>
        <button type="button" class="btn" data-open="projects">목록으로 보기</button>
      </div>
    </div>
  </section>

  <!-- 3D 가 안 되거나 느릴 때, 그리고 메뉴의 프로젝트: 목록 화면 -->
  <main class="listview" id="listview" hidden>
    <p class="notice" id="notice" hidden></p>
    <h1>프로젝트</h1>
    <div class="cards" id="cards-page"></div>
    <p class="back3d"><button type="button" class="btn" id="to3d" hidden>3D 로비로 들어가기</button></p>
  </main>

  <!-- 메뉴에서 여는 판: 프로젝트 목록, 소개, 연락처 -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <header>
      <h2 id="sheet-title"></h2>
      <button type="button" class="close" data-close aria-label="닫기">닫기</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>

  <!-- 포스터를 누르면 열리는 프로젝트 창 -->
  <dialog class="window" id="window" aria-labelledby="window-title">
    <div class="window-poster" id="window-poster"></div>
    <div class="window-main">
      <header>
        <p class="window-no" id="window-no"></p>
        <h2 id="window-title"></h2>
        <p class="window-tagline" id="window-tagline"></p>
      </header>
      <div class="window-body" id="window-body"></div>
      <div class="window-links" id="window-links"></div>
    </div>
    <button type="button" class="close" data-close aria-label="닫기">닫기</button>
  </dialog>

  <noscript>
    <div class="noscript">
      <h1>RONANLAB 포트폴리오</h1>
      <p>프로젝트: RONANLAB INFRA, FOREMAN, PETMINT, RUNSHOES</p>
      <p>자바스크립트를 켜면 로비와 목록을 볼 수 있습니다.</p>
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
